<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AceProxy Mobile">
    <meta name="theme-color" content="#0a0c10">
    <meta name="description" content="HTTPAceProxy Mobile-First Web Player v09.08.07">
    <title>AceProxy Mobile</title>
    <link rel="shortcut icon" href="/stat/img/shesterenka.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Players: Hls.js & mpegts.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>

    <style>
        :root {
            --bg-body: #0a0c10;
            --bg-surface: #12151c;
            --bg-card: #181c26;
            --bg-elevated: #212634;
            --border: rgba(255, 255, 255, 0.08);
            --border-active: #22c55e;
            --accent: #22c55e;
            --accent-glow: rgba(34, 197, 94, 0.25);
            --accent-red: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --touch-target: 42px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 14px;
            line-height: 1.4;
        }

        /* Contenedor Principal Optimizado */
        .mobile-app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            position: relative;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }

        /* Barra de Navegación Compacta */
        .mobile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: max(8px, env(safe-area-inset-top)) 12px 8px 12px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .header-logo {
            width: 24px;
            height: 24px;
            border-radius: 6px;
        }

        .header-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #fff 40%, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-badge {
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent);
            border: 1px solid rgba(34, 197, 94, 0.3);
            text-transform: uppercase;
        }

        /* Botones de acción situados a la izquierda del botón EPG */
        .header-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-icon-btn {
            min-height: 36px;
            min-width: 36px;
            padding: 0 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .header-icon-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .header-icon-btn.accent {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.35);
            color: #4ade80;
        }

        /* 1. Reproductor Superior Sticky 16:9 */
        .player-sticky-wrap {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #000;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .video-aspect-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mobile-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        .player-idle-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #181c26 0%, #0a0c10 80%);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            z-index: 10;
        }

        .idle-play-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px var(--accent-glow);
            margin-bottom: 10px;
            transition: transform 0.2s;
        }

        .idle-play-btn:active {
            transform: scale(0.9);
        }

        .idle-play-btn svg {
            width: 24px;
            height: 24px;
            fill: #fff;
            margin-left: 3px;
        }

        .idle-text {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
        }

        .idle-subtext {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 2. Ficha de Información de Canal y EPG */
        .current-program-card {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .channel-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .channel-main-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            flex: 1;
        }

        .channel-thumb {
            width: 48px;
            height: 48px;
            min-width: 48px;
            min-height: 48px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            object-fit: contain;
            padding: 2px;
            flex-shrink: 0;
        }

        .channel-names {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
        }

        .channel-display-name {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .channel-dial-badge {
            font-size: 10px;
            font-weight: 800;
            font-family: var(--font-mono);
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.07);
            padding: 1px 5px;
            border-radius: 4px;
        }

        .channel-cid-strip {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            word-break: break-all;
            white-space: normal;
            line-height: 1.35;
        }

        /* Ficha EPG Dinámica con Scroll Horizontal */
        .epg-carousel-wrap {
            width: 100%;
            overflow: hidden;
            margin: 2px 0;
        }

        .epg-carousel-track {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 2px 0 6px 0;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .epg-carousel-track::-webkit-scrollbar {
            height: 3px;
        }

        .epg-carousel-track::-webkit-scrollbar-track {
            background: transparent;
        }

        .epg-carousel-track::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .epg-program-box {
            flex: 0 0 100%;
            width: 100%;
            min-width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            scroll-snap-align: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: all 0.2s;
        }

        .epg-program-box.is-live {
            border-color: rgba(34, 197, 94, 0.45);
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.08), rgba(255, 255, 255, 0.02));
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.12);
        }

        .epg-program-box.is-past {
            opacity: 0.65;
            background: rgba(0, 0, 0, 0.25);
        }

        .epg-program-box.is-future {
            opacity: 0.92;
        }

        .epg-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .epg-show-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }

        .epg-time-badge {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .epg-progress-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .epg-progress-track {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }

        .epg-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #4ade80);
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .epg-progress-labels {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
        }

        .epg-pct-text {
            color: var(--text-muted);
            font-weight: 600;
        }

        .epg-rem-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 5px;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 700;
        }

        .epg-desc-preview {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: pointer;
        }

        .epg-desc-preview.expanded {
            -webkit-line-clamp: unset;
            line-clamp: unset;
        }


        /* 3. Lista Inferior de Canales (Pestañas Favoritos / Todos) */

        .channels-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px 10px;
            gap: 8px;
        }

        .channel-tabs-bar {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 2px;
            gap: 3px;
        }

        .channel-tab-btn {
            flex: 1;
            min-height: 36px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .channel-tab-btn.active {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .channel-tab-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 1px 5px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: inherit;
        }

        .channel-tab-btn.active .channel-tab-badge {
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
        }

        .channel-search-bar {
            position: relative;
            width: 100%;
        }

        .channel-search-bar input {
            width: 100%;
            min-height: 40px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 12px 0 34px;
            font-size: 13px;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .channel-search-bar input:focus {
            border-color: var(--accent);
        }

        .channel-search-bar svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            fill: var(--text-muted);
            pointer-events: none;
        }

        .channels-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .channel-row {
            min-height: 56px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .channel-row:active {
            transform: scale(0.98);
            background: var(--bg-card);
        }

        .channel-row.active {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.14), rgba(34, 197, 94, 0.03));
            box-shadow: 0 3px 10px rgba(34, 197, 94, 0.15);
        }

        .channel-logo {
            width: 48px;
            height: 48px;
            min-width: 48px;
            min-height: 48px;
            border-radius: 8px;
            background: var(--bg-card);
            object-fit: contain;
            border: 1px solid var(--border);
            padding: 2px;
            flex-shrink: 0;
        }

        .channel-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            gap: 2px;
        }

        .channel-name-line {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
        }

        .channel-dial-num {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-muted);
            font-family: var(--font-mono);
            background: rgba(255, 255, 255, 0.06);
            padding: 1px 4px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .channel-name {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .channel-active-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
            display: none;
            flex-shrink: 0;
        }

        .channel-row.active .channel-active-dot {
            display: block;
        }

        .channel-epg-line {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .channel-epg-line .live-tag {
            color: var(--accent);
            font-weight: 800;
            font-size: 9px;
            background: rgba(34, 197, 94, 0.15);
            padding: 1px 4px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .channel-epg-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .channel-rem-badge {
            margin-left: auto;
            font-size: 9px;
            font-weight: 700;
            color: #4ade80;
            background: rgba(34, 197, 94, 0.12);
            padding: 1px 5px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Modal Bottom Sheet - ID Manual */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-sheet {
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            border-radius: 18px 18px 0 0;
            width: 100%;
            max-width: 640px;
            padding: 18px 18px max(20px, env(safe-area-inset-bottom)) 18px;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-backdrop.open .modal-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            align-self: center;
        }

        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sheet-title {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
        }

        .sheet-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            min-width: 32px;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }

        .modal-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-input-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-input {
            width: 100%;
            min-height: 44px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: #fff;
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--accent);
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 8px;
            margin-top: 2px;
        }

        .modal-btn-secondary {
            min-height: 42px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn-primary {
            min-height: 42px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* Toast Feedback */
        .mobile-toast {
            position: fixed;
            bottom: max(16px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(18, 21, 28, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            color: #fff;
            padding: 9px 16px;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 300;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .mobile-toast.visible {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <div class="mobile-app">
        <!-- Cabecera Compacta: Botones de acción situados a la izquierda del botón EPG -->
        <header class="mobile-header">
            <a href="/mobile/" class="header-brand">
                <span class="header-title">HTTPAceProxy</span>
                <span class="header-badge">Mobile</span>
            </a>
            <div class="header-links">
                <!-- Botón Ordenar Alfabéticamente a la izquierda de copiar -->
                <button id="btn-header-sort-alpha" class="header-icon-btn" onclick="toggleAlphabeticalSort()"
                    title="Ordenar alfabéticamente (A-Z)">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                        <path d="M19 17h3l-4 4-4-4h3V3h2v14zM2 17h7v2H2v-2zm0-7h11v2H2v-2zm0-7h15v2H2V3z" />
                    </svg>
                </button>
                <!-- Botón Copiar Canal (VLC / stream virtual) -->
                <button id="btn-header-copy-vlc" class="header-icon-btn accent" onclick="copyActiveChannelUrl()"
                    title="Copiar enlace de reproducción (VLC / Stream)">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                        <path
                            d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                    </svg>
                </button>
                <!-- Botón ID Manual a la izquierda de /epg -->
                <button id="btn-header-manual-id" class="header-icon-btn" onclick="openManualIdModal()"
                    title="Reproducir Content ID Manual AceStream">

                <!-- Botón Versión Escritorio -->
                <a href="/player/" class="header-icon-btn" title="Versión Escritorio Bento">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path
                            d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7l-2 3v1h8v-1l-2-3h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 16H3V4h18v10z" />

        <!-- 1. Reproductor Superior Sticky 16:9 -->
        <div class="player-sticky-wrap">
            <div class="video-aspect-box">

                <div id="player-idle" class="player-idle-placeholder" onclick="startCurrentOrFirstChannel()">

        <!-- 2. Ficha de Canal Actual con Información EPG en Tiempo Real y Calidades Dinámicas -->
        <section class="current-program-card">
            <div class="channel-info-row">
                <div class="channel-main-meta">
                    <img id="active-channel-logo" class="channel-thumb" src="/stat/img/shesterenka.png" alt="Canal">
                    <div class="channel-names">
                        <div class="channel-display-name">
                            <span id="active-channel-dial" class="channel-dial-badge">#--</span>
                            <span id="active-channel-name">Sintonizando...</span>
                        </div>
                        <div id="active-channel-cid" class="channel-cid-strip" onclick="copyActiveContentId()"
                            title="Toca para copiar Content ID activo">
                            <span id="active-cid-text">Auto Engine</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ficha EPG Dinámica con Scroll Horizontal (Programa anterior, actual y posteriores) -->
            <div class="epg-carousel-wrap">
                <div id="epg-carousel-track" class="epg-carousel-track">
                    <div class="epg-program-box is-live">
                        <div class="epg-title-row">
                            <div class="epg-show-title">Programación en directo</div>
                            <div class="epg-time-badge">--:-- - --:--</div>
                        </div>
                        <div class="epg-progress-container">
                            <div class="epg-progress-track">
                                <div class="epg-progress-fill" style="width: 0%;"></div>
                            </div>
                            <div class="epg-progress-labels">
                                <span class="epg-pct-text">--%</span>
                                <span class="epg-rem-badge">⏱️ Quedan -- min</span>
                            </div>
                        </div>
                        <div class="epg-desc-preview">Sincronizando guía de eventos...</div>
                    </div>
                </div>
            </div>

        </section>

        <!-- 3. Lista Inferior de Canales EPG (Pestañas Favoritos / Todos) -->
        <section class="channels-section">
            <div class="channel-tabs-bar">
                <button class="channel-tab-btn active" id="tab-btn-favs" onclick="switchChannelTab('favs')">
                    <span>⭐ Favoritos</span>
                    <span id="fav-count-badge" class="channel-tab-badge">(0)</span>
                </button>
                <button class="channel-tab-btn" id="tab-btn-all" onclick="switchChannelTab('all')">
                    <span>Canales EPG</span>
                    <span id="all-count-badge" class="channel-tab-badge">(...)</span>
                </button>
            </div>

            <div class="channel-search-bar">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                </svg>
                <input type="text" id="channel-search-input" placeholder="Buscar canal o programa..."
                    oninput="filterChannels(this.value)">
            </div>

            <div id="channels-container" class="channels-list">
                <div style="padding: 30px 10px; text-align: center; color: var(--text-muted);">
                    Sincronizando canales EPG...
                </div>
            </div>
        </section>
    </div>

    <!-- Modal Bottom Sheet: ID Manual -->
    <div id="manual-modal" class="modal-backdrop" onclick="closeManualIdModal(event)">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <div class="sheet-title">Reproducir Content ID Manual</div>
                <button class="sheet-close-btn" onclick="closeManualIdModal()">✕</button>
            </div>
            <div class="modal-input-group">
                <label class="modal-input-label">Content ID AceStream (40 caracteres)</label>
                <input type="text" id="manual-cid-input" class="modal-input"
                    placeholder="Pega el hash de 40 caracteres..." maxlength="40" autocomplete="off" autocorrect="off"
                    autocapitalize="off" spellcheck="false">
            </div>
            <div class="modal-actions">
                <button class="modal-btn-secondary" onclick="pasteFromClipboard()">📋 Pegar</button>
                <button class="modal-btn-primary" onclick="playManualContentId()">▶ Reproducir</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="mobile-toast" class="mobile-toast">
        <span id="toast-text">Notificación</span>
    </div>

    <script>
        // --- ESTADO GLOBAL MOBILE v09.08.07 ---
        const DEFAULT_EPG_URL = "https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv_sincolor0.xml.gz";
        let epgChannels = [];
        let epgProgrammes = {};
        let customLogosMap = {};
        let favoriteList = [];
        let currentTab = 'favs'; // 'favs' o 'all'
        let activeChannel = null;
        let currentPlayingCid = '';
        let searchQuery = '';
        let mpegtsPlayer = null;
        let hlsPlayer = null;
        let epgSyncTimer = null;

        // Normalización canónica estricta compartida con C++ y /epg
        function toCanonicalSlug(name) {
            if (!name) return 'channel';
            let n = name.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/^\s*\d+[\.\s_–-]+/g, ' ')
                .replace(/[\(\[\{]\s*(?:mirror|replica|m|opt|alt)?\s*\d+\s*[\)\]\}]/gi, ' ')
                .replace(/\b(1080p|1080i|1080|720p|720i|720|576p|576i|480p|4k|uhd|fhda?|720a?|hd|sd|hevc|h265|h264|back|backup|opt|alt|directo|live|envivo|castellano|spanish|spain|espana|acestream)\b/gi, ' ')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
            return n || 'channel';
        }

        function getChannelEffectiveLogo(chan) {
            if (!chan) return '/stat/img/shesterenka.png';
            const slug = toCanonicalSlug(chan.name);
            const slugId = toCanonicalSlug(chan.id);
            if (customLogosMap[slug]) return customLogosMap[slug];
            if (customLogosMap[slugId]) return customLogosMap[slugId];
            if (customLogosMap[chan.name]) return customLogosMap[chan.name];
            if (customLogosMap[chan.id]) return customLogosMap[chan.id];
            return chan.logo || '/stat/img/shesterenka.png';
        }

        // --- INICIALIZACIÓN ---
        window.addEventListener('DOMContentLoaded', async () => {
            // Cargar logos personalizados y favoritos guardados
            await loadCustomLogos();
            await loadServerFavorites();

            // Cargar e indexar Guía EPG
            await loadEpgData();

            // Temporizador reactivo para barra de progreso y estado EPG cada 15 segundos
            epgSyncTimer = setInterval(() => {
                updateActiveProgramCard();
            }, 15000);
        });

        // --- CARGA DE FAVORITOS Y LOGOS ---
        async function loadServerFavorites() {
            try {
                const resp = await fetch('/epg?action=get_favorites');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data && data.status === 'success' && Array.isArray(data.favorites)) {
                        favoriteList = data.favorites;
                        localStorage.setItem('epg_favorites', JSON.stringify(data.favorites));
                    }
                }
            } catch (e) {
                try {
                    favoriteList = JSON.parse(localStorage.getItem('epg_favorites')) || [];
                } catch (_) {
                    favoriteList = [];
                }
            }
        }

        async function loadCustomLogos() {
            try {
                const resp = await fetch('/epg?action=get_custom_logos');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data && data.status === 'success' && data.logos) {
                        customLogosMap = data.logos;
                        localStorage.setItem('custom_logos', JSON.stringify(data.logos));
                    }
                }
            } catch (e) {
                try {
                    customLogosMap = JSON.parse(localStorage.getItem('custom_logos')) || {};
                } catch (_) { }
            }
        }

        // --- CARGA Y PARSEO ROBUSTO DE GUÍA EPG ---
        async function loadEpgData(forceRefresh = false) {
            const container = document.getElementById('channels-container');
            try {
                const cfgRes = await fetch('/config?action=get_config');
                const cfg = await cfgRes.json();

                let sources = (cfg && cfg.epg_sources) ? cfg.epg_sources.filter(s => s.enabled) : [];
                if (sources.length === 0) {
                    const singleUrl = (cfg && cfg.urls && cfg.urls.epg) ? cfg.urls.epg : DEFAULT_EPG_URL;
                    sources = [{ name: 'default', title: 'EPG Principal', url: singleUrl, enabled: true }];
                }

                epgChannels = [];
                epgProgrammes = {};

                let loadedCount = 0;
                for (const src of sources) {
                    try {
                        const response = await fetch(src.url + (forceRefresh ? '?t=' + Date.now() : ''));
                        let xmlText = '';
                        if (src.url.endsWith('.gz') && typeof DecompressionStream !== 'undefined') {
                            try {
                                const ds = new DecompressionStream('gzip');
                                const decompressedStream = response.clone().body.pipeThrough(ds);
                                xmlText = await new Response(decompressedStream).text();
                            } catch (e) {
                                xmlText = await response.text();
                            }
                        } else {
                            xmlText = await response.text();
                        }

                        parseXmltvChunk(xmlText);
                        loadedCount++;
                    } catch (e) {
                        console.error(`Error cargando fuente EPG (${src.name}):`, e);
                    }
                }

                if (epgChannels.length === 0) {
                    // Fallback rápido si el EPG externo no es accesible
                    await loadChannelsFromM3uFallback();
                }

                // Si hay favoritos, comenzar en pestaña Favoritos; si no, mostrar Todos
                if (favoriteList.length > 0) {
                    currentTab = 'favs';
                } else {
                    currentTab = 'all';
                }
                updateTabButtons();

                // Renderizar lista de canales
                renderChannelsList();

                // Auto-seleccionar primer canal disponible para vista previa
                const renderList = getRenderableChannels();
                if (renderList.length > 0 && !activeChannel) {
                    selectChannel(renderList[0].chan, renderList[0].dial, false);
                }

            } catch (err) {
                console.warn('Error en sincronización EPG, aplicando fallback:', err);
                await loadChannelsFromM3uFallback();
                renderChannelsList();
            }
        }

        function parseXmltvChunk(xmlText) {
            if (!xmlText) return;
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

            const existingChanIds = new Set(epgChannels.map(c => c.id));

            // 1. Canales Canónicos EPG
            const chanNodes = xmlDoc.getElementsByTagName('channel');
            for (let i = 0; i < chanNodes.length; i++) {
                const node = chanNodes[i];
                const id = node.getAttribute('id');
                if (!id) continue;
                const nameNode = node.getElementsByTagName('display-name')[0];
                const name = nameNode ? nameNode.textContent.trim() : id;
                const iconNode = node.getElementsByTagName('icon')[0];
                const logo = iconNode ? iconNode.getAttribute('src') : '';

                if (!existingChanIds.has(id)) {
                    epgChannels.push({ id, name, logo, slug: toCanonicalSlug(name) });
                    existingChanIds.add(id);
                }
                if (!epgProgrammes[id]) {
                    epgProgrammes[id] = [];
                }
            }

            // 2. Programas y Horarios
            const nowTime = new Date();
            const minTime = new Date(nowTime.getTime() - 2 * 3600000);
            const maxTime = new Date(nowTime.getTime() + 48 * 3600000);
            const progNodes = xmlDoc.getElementsByTagName('programme');

            for (let i = 0; i < progNodes.length; i++) {
                const node = progNodes[i];
                const channelId = node.getAttribute('channel');
                const startStr = node.getAttribute('start');
                const stopStr = node.getAttribute('stop');
                const titleNode = node.getElementsByTagName('title')[0];
                const descNode = node.getElementsByTagName('desc')[0];
                const catNode = node.getElementsByTagName('category')[0];

                if (channelId && startStr && stopStr && titleNode) {
                    const startDate = parseXMLTVDate(startStr);
                    const stopDate = parseXMLTVDate(stopStr);

                    if (stopDate >= minTime && startDate <= maxTime) {
                        const prog = {
                            start: startDate,
                            stop: stopDate,
                            title: titleNode.textContent.trim(),
                            desc: descNode ? descNode.textContent.trim() : 'Sin información detallada.',
                            category: catNode ? catNode.textContent.trim() : 'General'
                        };

                        if (!epgProgrammes[channelId]) {
                            epgProgrammes[channelId] = [];
                        }
                        epgProgrammes[channelId].push(prog);
                    }
                }
            }

            // Ordenar cronológicamente
            for (const cid in epgProgrammes) {
                epgProgrammes[cid].sort((a, b) => a.start - b.start);
            }
        }

        async function loadChannelsFromM3uFallback() {
            try {
                const res = await fetch('/aio');
                if (res.ok) {
                    const text = await res.text();
                    const lines = text.split('\n');
                    const seen = new Set();
                    let dial = 1;
                    lines.forEach(l => {
                        if (l.startsWith('#EXTINF:')) {
                            const nameMatch = l.match(/,(.*)$/);
                            const name = nameMatch ? nameMatch[1].trim() : 'Canal';
                            const logoMatch = l.match(/tvg-logo="([^"]*)"/i);
                            const logo = logoMatch ? logoMatch[1].trim() : '';
                            const cSlug = toCanonicalSlug(name);
                            if (!seen.has(cSlug)) {
                                seen.add(cSlug);
                                epgChannels.push({ id: cSlug, name, logo, slug: cSlug, dial: dial++ });
                            }
                        }
                    });
                }
            } catch (_) { }
        }

        // --- GESTIÓN DE FAVORITOS ---
        function isFavorite(chanId, chanName) {
            if (!favoriteList || favoriteList.length === 0) return false;
            const slug = toCanonicalSlug(chanName || chanId);
            return favoriteList.some(f => f === chanId || f === chanName || toCanonicalSlug(f) === slug);
        }

        async function toggleFavorite(chanId, chanName, e) {
            if (e) {
                e.stopPropagation();
                e.preventDefault();
            }
            const slug = toCanonicalSlug(chanName || chanId);
            let idx = favoriteList.indexOf(chanId);
            if (idx === -1) {
                idx = favoriteList.findIndex(f => toCanonicalSlug(f) === slug);
            }

            let added = false;
            if (idx !== -1) {
                favoriteList.splice(idx, 1);
                added = false;
            } else {
                favoriteList.push(chanName || chanId);
                added = true;
            }

            localStorage.setItem('epg_favorites', JSON.stringify(favoriteList));
            try {
                fetch('/epg?action=set_favorites_order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ favorites: favoriteList, favorites_order: favoriteList })
                }).catch(() => { });
            } catch (_) { }

            renderChannelsList();
            showToast(added ? `⭐ ${chanName || chanId} añadido a Favoritos` : `Quitado de Favoritos`);
        }

        // --- RENDERIZADO DE CANALES ---
        let isAlphaSorted = false;

        function toggleAlphabeticalSort() {
            isAlphaSorted = !isAlphaSorted;
            const btn = document.getElementById('btn-header-sort-alpha');
            if (btn) {
                btn.classList.toggle('accent', isAlphaSorted);
            }
            showToast(isAlphaSorted ? '🔤 Orden alfabético (A-Z)' : '🔢 Orden por defecto');
            renderChannelsList();
        }

        function getRenderableChannels() {
            let list = [];
            if (currentTab === 'favs') {
                favoriteList.forEach((favId, idx) => {
                    const favSlug = toCanonicalSlug(favId);
                    const chan = epgChannels.find(c => c.id === favId || toCanonicalSlug(c.name) === favSlug || toCanonicalSlug(c.id) === favSlug);
                    if (chan) {
                        list.push({ chan, dial: idx + 1, isFav: true });
                    } else {
                        // Entrada virtual de favorito si aún no cargó el XML
                        list.push({ chan: { id: favId, name: favId, slug: favSlug, logo: '' }, dial: idx + 1, isFav: true });
                    }
                });
            } else {
                epgChannels.forEach((chan, idx) => {
                    const isFav = isFavorite(chan.id, chan.name);
                    let dial = idx + 1;
                    if (isFav) {
                        const fIdx = favoriteList.findIndex(f => f === chan.id || toCanonicalSlug(f) === chan.slug);
                        if (fIdx !== -1) dial = fIdx + 1;
                    }
                    list.push({ chan, dial, isFav });
                });
            }

            if (isAlphaSorted) {
                list.sort((a, b) => (a.chan.name || '').localeCompare(b.chan.name || '', 'es', { sensitivity: 'base', numeric: true }));
            }

            return list;
        }

        function renderChannelsList() {
            const container = document.getElementById('channels-container');
            const favBadge = document.getElementById('fav-count-badge');
            const allBadge = document.getElementById('all-count-badge');
            if (favBadge) favBadge.textContent = `(${favoriteList.length})`;
            if (allBadge) allBadge.textContent = `(${epgChannels.length})`;

            let items = getRenderableChannels();

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                items = items.filter(item => {
                    const c = item.chan;
                    const inName = (c.name || '').toLowerCase().includes(q) || (c.slug || '').includes(q);
                    const inDial = String(item.dial).includes(q);
                    const prog = getLiveProgramForChannel(c);
                    const inProg = prog && prog.title.toLowerCase().includes(q);
                    return inName || inDial || inProg;
                });
            }

            if (items.length === 0) {
                if (currentTab === 'favs') {
                    container.innerHTML = `
                        <div style="background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px 16px; text-align: center;">
                            <div style="font-size: 30px; margin-bottom: 8px;">⭐</div>
                            <div style="font-weight: 700; color: #fff; margin-bottom: 4px; font-size: 14px;">Sin canales en Favoritos</div>
                            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">
                                Toca la estrella ☆ en cualquiera de los <strong>${epgChannels.length} canales EPG</strong> para tenerlos aquí organizados.
                            </div>
                            <button onclick="switchChannelTab('all')" style="background: var(--accent); color: #fff; border: none; padding: 9px 18px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer;">
                                📺 Ver Todos los Canales (${epgChannels.length})
                            </button>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div style="padding: 24px 10px; text-align: center; color: var(--text-muted); font-size: 13px;">
                            No se encontraron canales para "${escapeHtml(searchQuery)}"
                        </div>
                    `;
                }
                return;
            }

            const now = new Date();
            const format = { hour: '2-digit', minute: '2-digit', hour12: false };

            container.innerHTML = items.map(item => {
                const chan = item.chan;
                const dial = item.dial;
                const isFav = item.isFav;
                const isActive = activeChannel && (activeChannel.slug === chan.slug || activeChannel.id === chan.id);
                const logoSrc = getChannelEffectiveLogo(chan);
                const prog = getLiveProgramForChannel(chan);

                let epgHtml = '';
                if (prog) {
                    const startStr = prog.start.toLocaleTimeString('es-ES', format);
                    const stopStr = prog.stop.toLocaleTimeString('es-ES', format);
                    const remMin = Math.max(0, Math.round((prog.stop - now) / 60000));
                    epgHtml = `
                        <span class="live-tag">AHORA</span>
                        <span class="channel-epg-title">${escapeHtml(prog.title)}</span>
                        <span class="channel-rem-badge">⏱️ ${remMin}m</span>
                    `;
                } else {
                    epgHtml = `
                        <span class="live-tag" style="background: rgba(255, 255, 255, 0.06); color: var(--text-muted);">DIRECTO</span>
                        <span class="channel-epg-title" style="color: var(--text-muted);">Emisión en directo</span>
                    `;
                }

                return `
                    <div class="channel-row ${isActive ? 'active' : ''}" onclick="selectAndPlayChannel('${escapeHtml(chan.slug || chan.id)}', ${dial})">
                        <img class="channel-logo" src="${escapeHtml(logoSrc)}" onerror="this.src='/stat/img/shesterenka.png'" alt="">
                        <div class="channel-info">
                            <div class="channel-name-line">
                                <span class="channel-dial-num">#${dial}</span>
                                <span class="channel-name">${escapeHtml(chan.name)}</span>
                                <span class="channel-active-dot"></span>
                            </div>
                            <div class="channel-epg-line">
                                ${epgHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchChannelTab(tab) {
            currentTab = tab;
            updateTabButtons();
            renderChannelsList();
        }

        function updateTabButtons() {
            const btnFavs = document.getElementById('tab-btn-favs');
            const btnAll = document.getElementById('tab-btn-all');
            if (btnFavs && btnAll) {
                btnFavs.classList.toggle('active', currentTab === 'favs');
                btnAll.classList.toggle('active', currentTab === 'all');
            }
        }

        function filterChannels(q) {
            searchQuery = (q || '').trim();
            renderChannelsList();
        }

        // --- PROGRAMACIÓN EPG DEL CANAL ACTIVO ---
        function getLiveProgramForChannel(chan) {
            if (!chan) return null;
            const progList = epgProgrammes[chan.id] || epgProgrammes[chan.slug] || [];
            if (!progList || progList.length === 0) return null;
            const now = new Date();
            return progList.find(p => now >= p.start && now < p.stop) || null;
        }

        function updateActiveProgramCard() {
            if (!activeChannel) return;
            const track = document.getElementById('epg-carousel-track');
            if (!track) return;

            const progList = epgProgrammes[activeChannel.id] || epgProgrammes[activeChannel.slug] || [];
            if (!progList || progList.length === 0) {
                track.innerHTML = `
                    <div class="epg-program-box is-live">
                        <div class="epg-title-row">
                            <div class="epg-show-title">${escapeHtml(activeChannel.name)}</div>
                            <div class="epg-time-badge">En directo</div>
                        </div>
                        <div class="epg-progress-container">
                            <div class="epg-progress-track">
                                <div class="epg-progress-fill" style="width: 100%;"></div>
                            </div>
                            <div class="epg-progress-labels">
                                <span class="epg-pct-text">En vivo</span>
                                <span class="epg-rem-badge">🔴 EN DIRECTO</span>
                            </div>
                        </div>
                        <div class="epg-desc-preview">Guía EPG en tiempo real. Programa emitido en directo.</div>
                    </div>
                `;
                return;
            }

            const now = new Date();
            const format = { hour: '2-digit', minute: '2-digit', hour12: false };
            const currentIdx = progList.findIndex(p => now >= p.start && now < p.stop);

            let progsToShow = [];
            if (currentIdx !== -1) {
                // Programa anterior (1 previo para no saturar)
                if (currentIdx > 0) {
                    progsToShow.push({ prog: progList[currentIdx - 1], type: 'past' });
                }
                // Programa actual en emisión
                progsToShow.push({ prog: progList[currentIdx], type: 'live' });
                // Programas posteriores (hasta 4 siguientes para no saturar)
                for (let i = currentIdx + 1; i < Math.min(progList.length, currentIdx + 5); i++) {
                    progsToShow.push({ prog: progList[i], type: 'future' });
                }
            } else {
                // Si ningún programa coincide exactamente, buscar el próximo a emitirse
                const nextIdx = progList.findIndex(p => p.start > now);
                if (nextIdx !== -1) {
                    if (nextIdx > 0) {
                        progsToShow.push({ prog: progList[nextIdx - 1], type: 'past' });
                    }
                    for (let i = nextIdx; i < Math.min(progList.length, nextIdx + 5); i++) {
                        progsToShow.push({ prog: progList[i], type: i === nextIdx ? 'live' : 'future' });
                    }
                } else {
                    // Si terminaron los eventos del día, mostrar los últimos 3
                    const slice = progList.slice(-3);
                    slice.forEach(p => progsToShow.push({ prog: p, type: 'past' }));
                }
            }

            let cardsHtml = '';
            progsToShow.forEach(item => {
                const p = item.prog;
                const sStr = p.start.toLocaleTimeString('es-ES', format);
                const eStr = p.stop.toLocaleTimeString('es-ES', format);

                if (item.type === 'live') {
                    const total = p.stop - p.start;
                    const elapsed = Math.max(0, now - p.start);
                    const pct = Math.min(100, Math.max(0, Math.round((elapsed / total) * 100)));
                    const remMin = Math.max(0, Math.round((p.stop - now) / 60000));
                    cardsHtml += `
                        <div class="epg-program-box is-live" id="epg-card-current">
                            <div class="epg-title-row">
                                <div class="epg-show-title">${escapeHtml(p.title)}</div>
                                <div class="epg-time-badge">${sStr} - ${eStr}</div>
                            </div>
                            <div class="epg-progress-container">
                                <div class="epg-progress-track">
                                    <div class="epg-progress-fill" style="width: ${pct}%;"></div>
                                </div>
                                <div class="epg-progress-labels">
                                    <span class="epg-pct-text">${pct}% transcurrido</span>
                                    <span class="epg-rem-badge">⏱️ Quedan ${remMin} min</span>
                                </div>
                            </div>
                            <div class="epg-desc-preview" onclick="this.classList.toggle('expanded')" title="Toca para expandir sinopsis">
                                ${escapeHtml(p.desc || 'Sin sinopsis disponible.')}
                            </div>
                        </div>
                    `;
                } else if (item.type === 'past') {
                    cardsHtml += `
                        <div class="epg-program-box is-past">
                            <div class="epg-title-row">
                                <div class="epg-show-title">${escapeHtml(p.title)}</div>
                                <div class="epg-time-badge">${sStr} - ${eStr}</div>
                            </div>
                            <div class="epg-progress-labels" style="margin: 2px 0;">
                                <span style="font-size: 10px; color: var(--text-muted); font-weight: 600;">⏮️ Programa anterior</span>
                                <span style="font-size: 10px; color: var(--text-muted); background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 4px;">Finalizado</span>
                            </div>
                            <div class="epg-desc-preview" onclick="this.classList.toggle('expanded')" title="Toca para expandir sinopsis">
                                ${escapeHtml(p.desc || 'Sin sinopsis disponible.')}
                            </div>
                        </div>
                    `;
                } else {
                    const startInMin = Math.max(0, Math.round((p.start - now) / 60000));
                    const whenText = startInMin > 60 ? `En ${Math.round(startInMin / 60)}h` : `En ${startInMin} min`;
                    cardsHtml += `
                        <div class="epg-program-box is-future">
                            <div class="epg-title-row">
                                <div class="epg-show-title">${escapeHtml(p.title)}</div>
                                <div class="epg-time-badge">${sStr} - ${eStr}</div>
                            </div>
                            <div class="epg-progress-labels" style="margin: 2px 0;">
                                <span style="font-size: 10px; color: var(--text-secondary); font-weight: 600;">⏭️ A continuación</span>
                                <span style="font-size: 10px; color: #60a5fa; background: rgba(96, 165, 250, 0.12); border: 1px solid rgba(96, 165, 250, 0.25); padding: 1px 5px; border-radius: 4px; font-weight: 700;">${whenText}</span>
                            </div>
                            <div class="epg-desc-preview" onclick="this.classList.toggle('expanded')" title="Toca para expandir sinopsis">
                                ${escapeHtml(p.desc || 'Sin sinopsis disponible.')}
                            </div>
                        </div>
                    `;
                }
            });

            track.innerHTML = cardsHtml;

            setTimeout(() => {
                const liveCard = document.getElementById('epg-card-current');
                if (liveCard) {
                    liveCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, 80);
        }

        // --- SINTONIZACIÓN Y SELECCIÓN AUTOMÁTICA POR SEMILLAS ---
        async function selectChannel(chan, dial, startPlayback = true) {
            activeChannel = chan;
            activeChannel.dial = dial;

            document.getElementById('active-channel-name').textContent = chan.name;
            document.getElementById('active-channel-dial').textContent = dial ? `#${dial}` : '';
            document.getElementById('active-channel-logo').src = getChannelEffectiveLogo(chan);
            document.getElementById('idle-title').textContent = chan.name;
            document.getElementById('idle-sub').textContent = 'Toca para iniciar reproducción';

            updateActiveProgramCard();
            renderChannelsList();

            // Sintonizar directamente la URL VIRTUAL canónica
            const slug = chan.slug || toCanonicalSlug(chan.name);
            const streamUrl = `/auto/${encodeURIComponent(slug)}/stream.ts`;
            const cidStrip = document.getElementById('active-cid-text');
            if (cidStrip) cidStrip.textContent = `URL Virtual: /auto/${slug}`;

            if (startPlayback) {
                startPlaybackUrl(streamUrl, 'Auto Engine', '');
            }

            // Consultar datos en segundo plano para telemetría y resolución de CID
            try {
                fetch(`/auto/${encodeURIComponent(slug)}?action=list`)
                    .then(r => r.json())
                    .then(data => {
                        if (data && cidStrip) {
                            const resCid = data.resolved_content_id || (data.best_candidate && data.best_candidate.content_id) || '';
                            if (resCid) {
                                currentPlayingCid = resCid;
                                const best = data.best_candidate;
                                const peers = (best && best.peers !== undefined && best.peers > 0) ? ` (${best.peers} seeds)` : '';
                                const q = (best && best.quality_label) ? ` [${best.quality_label}]` : '';
                                cidStrip.textContent = `CID: ${resCid.substring(0, 16)}...${peers}${q} · /auto/${slug}`;
                            }
                        }
                    })
                    .catch(() => {});
            } catch (e) {}
        }

        async function selectAndPlayChannel(slugOrId, dial) {
            const chan = epgChannels.find(c => c.slug === slugOrId || c.id === slugOrId) ||
                favoriteList.find(f => toCanonicalSlug(f) === slugOrId);
            if (chan) {
                const cObj = (typeof chan === 'string') ? { id: chan, name: chan, slug: toCanonicalSlug(chan) } : chan;
                await selectChannel(cObj, dial, true);
            }
        }

        function startCurrentOrFirstChannel() {
            if (activeChannel) {
                selectChannel(activeChannel, activeChannel.dial, true);
            } else {
                const list = getRenderableChannels();
                if (list.length > 0) {
                    selectChannel(list[0].chan, list[0].dial, true);
                }
            }
        }

        // --- REPRODUCTOR HLS & MPEGTS ---
        function startPlaybackUrl(streamUrl, engineLabel, cid) {
            const video = document.getElementById('mobile-video');
            const idleCover = document.getElementById('player-idle');
            if (idleCover) idleCover.style.display = 'none';
            const liveBadge = document.getElementById('player-live-badge');
            if (liveBadge) liveBadge.style.display = 'inline-flex';
            const engBadge = document.getElementById('player-engine-badge');
            if (engBadge) engBadge.textContent = engineLabel || 'Auto Engine';

            // Parar instancias previas
            if (mpegtsPlayer) {
                try { mpegtsPlayer.destroy(); } catch (e) { }
                mpegtsPlayer = null;
            }
            if (hlsPlayer) {
                try { hlsPlayer.destroy(); } catch (e) { }
                hlsPlayer = null;
            }

            if (streamUrl.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
                hlsPlayer = new Hls({ enableWorker: true, lowLatencyMode: true });
                hlsPlayer.loadSource(streamUrl);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => { }));
            } else if (typeof mpegts !== 'undefined' && mpegts.isSupported()) {
                try {
                    mpegtsPlayer = mpegts.createPlayer({
                        type: 'mse',
                        isLive: true,
                        url: streamUrl
                    }, {
                        enableStashBuffer: true,
                        stashInitialSize: 256 * 1024,
                        liveBufferLatencyChasing: false,
                        autoCleanupSourceBuffer: true
                    });
                    mpegtsPlayer.attachMediaElement(video);
                    mpegtsPlayer.load();
                    mpegtsPlayer.play().catch(() => { });
                } catch (e) {
                    video.src = streamUrl;
                    video.play().catch(() => { });
                }
            } else {
                video.src = streamUrl;
                video.play().catch(() => { });
            }

            showToast(`▶ Sintonizando: ${activeChannel ? activeChannel.name : 'Canal'}`);
        }

        // --- ACCIONES DE CABECERA (Copiar Canal & ID Manual) ---
        function copyActiveChannelUrl() {
            if (!activeChannel) {
                showToast('Selecciona un canal primero');
                return;
            }
            const host = window.location.host || '127.0.0.1:8888';
            const slug = activeChannel.slug || toCanonicalSlug(activeChannel.name);
            const streamUrl = `http://${host}/auto/${encodeURIComponent(slug)}/stream.ts`;
            copyToClipboard(streamUrl, `📋 Enlace de ${activeChannel.name} copiado`);
        }

        function copyActiveContentId() {
            if (!currentPlayingCid) {
                showToast('Sin Content ID activo');
                return;
            }
            copyToClipboard(currentPlayingCid, `✓ Content ID copiado: ${currentPlayingCid}`);
        }

        function openManualIdModal() {
            document.getElementById('manual-modal').classList.add('open');
            setTimeout(() => document.getElementById('manual-cid-input').focus(), 150);
        }

        function closeManualIdModal() {
            document.getElementById('manual-modal').classList.remove('open');
        }

        async function pasteFromClipboard() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        const match = text.match(/[a-f0-9]{40}/i);
                        document.getElementById('manual-cid-input').value = match ? match[0].toLowerCase() : text.trim();
                        showToast('✓ ID pegado desde portapapeles');
                    }
                }
            } catch (err) {
                showToast('Pega manualmente en la casilla');
            }
        }

        function playManualContentId() {
            const raw = document.getElementById('manual-cid-input').value.trim();
            const match = raw.match(/[a-f0-9]{40}/i);
            if (!match) {
                showToast('Error: Ingresa un hash válido de 40 caracteres');
                return;
            }
            const cid = match[0].toLowerCase();
            closeManualIdModal();

            const customChannel = {
                id: `manual-${cid.substring(0, 8)}`,
                name: `AceStream ${cid.substring(0, 8)}...`,
                slug: `manual-${cid.substring(0, 8)}`,
                logo: '/stat/img/shesterenka.png'
            };
            activeChannel = customChannel;
            document.getElementById('active-channel-name').textContent = customChannel.name;
            document.getElementById('active-channel-dial').textContent = '#ID';
            document.getElementById('active-channel-logo').src = customChannel.logo;
            currentPlayingCid = cid;
            document.getElementById('active-cid-text').textContent = `CID: ${cid}`;

            startPlaybackUrl(`/content_id/${cid}/stream.ts`, `Manual CID`, cid);
        }

        // --- UTILIDADES ---
        function parseXMLTVDate(dateStr) {
            if (!dateStr) return new Date();
            const m = dateStr.trim().match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})(?:\s*([+-]\d{2}):?(\d{2}))?/);
            if (m) {
                const utc = Date.UTC(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]), parseInt(m[4]), parseInt(m[5]), parseInt(m[6]));
                if (m[7] !== undefined) {
                    const offset = (parseInt(m[7]) * 60 + parseInt(m[8] || '0')) * 60000;
                    return new Date(utc - offset);
                }
                return new Date(utc);
            }
            return new Date();
        }

        function copyToClipboard(text, successMsg) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(() => fallbackCopy(text, successMsg));
            } else {
                fallbackCopy(text, successMsg);
            }
        }

        function fallbackCopy(text, msg) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast(msg);
        }

        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('mobile-toast');
            document.getElementById('toast-text').textContent = msg;
            toast.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('visible'), 2600);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
