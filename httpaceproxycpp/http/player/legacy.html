<!DOCTYPE html>
<html lang="es">

<head>

    <title>HTTPAceProxy - Vista Legacy (iPad)</title>
    <link rel="shortcut icon" href="/stat/img/shesterenka.png" type="image/png">
    <style>
        /* Estilos ultra básicos, compatibles con WebKit antiguo (iOS 12.5.8) */
        body {
            font-family: -apple-system, sans-serif;
            background-color: #121214;
            color: #d1d1d6;
            margin: 0;
            padding: 0;
        }

        /* Navbar Plano Legacy (Ultra compatible ES5 / iOS 12) */
        .navbar {
            background-color: #1a1a1e;
            border-bottom: 1px solid #2d2d34;
            padding: 10px 15px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-flex-wrap: wrap;
            flex-wrap: wrap;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 16px;
            color: #ffffff;
            text-decoration: none;
            padding: 5px 0;
            display: inline-block;
        }

        .nav-links {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-wrap: wrap;
            flex-wrap: wrap;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #a8a8b2;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 10px;
            display: inline-block;
            border-radius: 4px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffffff;
            background-color: #29292e;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 10px;
            }

            .nav-brand {
                width: 100%;
                margin-bottom: 6px;
                text-align: center;
            }

            .nav-links {
                width: 100%;
                -webkit-box-pack: center;
                -webkit-justify-content: center;
                justify-content: center;
            }

            .nav-links a {
                padding: 6px 8px;
                font-size: 12px;
            }
        }

        .container {
            padding: 15px;
        }

        .header-section {
            margin-bottom: 15px;
            border-bottom: 1px solid #2d2d34;
            padding-bottom: 10px;
        }

        .header-section h2 {
            font-size: 18px;
            color: #ffffff;
            margin: 0 0 5px 0;
        }

        .header-section p {
            font-size: 12px;
            color: #8e8e93;
            margin: 0;
        }

        .source-select-container-legacy {
            margin-bottom: 12px;
        }

        .source-select-legacy {
            display: block;
            width: 100%;
            background-color: #1a1a1e;
            border: 1px solid #2d2d34;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
            -webkit-appearance: menulist;
            appearance: menulist;
        }

        .source-select-legacy:focus {
            border-color: #4cd964;
        }

        /* Selector de Calidad 1080 / 720 */
        .quality-toggle-legacy {
            display: inline-block;
            margin-top: 6px;
        }

        .quality-btn-legacy {
            background-color: #25252b;
            border: 1px solid #3a3a44;
            color: #a8a8b2;
            padding: 3px 8px;
            border-radius: 4px;

        .quality-btn-legacy:hover {

        }

        .quality-btn-legacy.quality-1080.active {
            background-color: #3b82f6;

        }

        .quality-btn-legacy.quality-720.active {

        }

        /* Controles de Paginación Legacy */
        .pagination-container-legacy {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            background-color: #1a1a1e;
            border: 1px solid #2d2d34;

        .pagination-info-legacy {
            display: flex;

        }

        .pagination-controls-legacy {

            align-items: center;

        }

        .pagination-btn-legacy {
            background-color: #2d2d34;

            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;

            outline: none;
        }

        .pagination-btn-legacy:hover:not(:disabled) {

        }

        .pagination-btn-legacy:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .items-per-page-legacy {
            background-color: #2d2d34;
            border: 1px solid #4a4a52;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }

        .search-container-legacy {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input-legacy {
            width: 100%;
            max-width: 320px;
            background-color: #1a1a1e;
            border: 1px solid #2d2d34;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        .search-input-legacy:focus {
            border-color: #4cd964;
        }

        /* Lista Legacy de alto rendimiento */
        .category-header {
            background-color: #1a1a1e;
            border: 1px solid #2d2d34;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;

            list-style: none;

        .channel-item {

        .channel-logo-container {
            float: left;

        .channel-name {
            font-size: 16px;

        .btn-play-legacy,
        .btn-copy-legacy {
            float: right;
            color: #ffffff;
            text-decoration: none;

            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 10px;

            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-play-legacy {
            background-color: #4cd964;
        }

        .btn-play-legacy:hover {
            background-color: #34c759;
        }

        .btn-copy-legacy {
            background-color: #2d2d34;
            border: 1px solid #4a4a52;

        }

        .btn-copy-legacy:hover {
            background-color: #3f3f46;
        }

        @media (min-width: 768px) and (max-width: 1024px) {
            .channel-list {
                display: grid !important;
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)) !important;
                gap: 12px !important;
            }

            .channel-item {
                margin-bottom: 0 !important;
            }
        }

        .loading-screen {
            text-align: center;
            padding: 30px;
            font-size: 13px;
            color: #8e8e93;
        }

        .footer-bar {
            background-color: #1a1a1e;
            border-top: 1px solid #2d2d34;
            padding: 8px 15px;
            font-size: 11px;
            color: #8e8e93;
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <!-- Navbar Legacy -->
    <div class="navbar">
        <a href="/stat" class="nav-brand">HTTPAceProxy</a>
        <div class="nav-links">
            <a href="/stat">Dashboard</a>
            <a href="/statplugin/">Canales</a>
            <a href="/fuentes/">Fuentes</a>
            <a href="/epg/">EPG</a>
            <a href="/player/index.html">Reproductor</a>
            <a href="/player/legacy.html" class="active">Reproductor Legacy</a>
        </div>
    </div>

    <!-- Container -->
    <div class="container">
        <div class="header-section"
            style="display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: 10px;">
            <div>
                <h2>Reproductor IPTV (Ligero)</h2>
                <p id="loading-status">Cargando canales para WebKit ES5...</p>
            </div>
            <div id="live-clock-legacy"
                style="font-weight: bold; color: #4CAF50; font-size: 14px; padding: 4px 10px; background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 6px;">
                --:--:--</div>
        </div>

        <!-- Desplegable de Fuentes Legacy -->
        <div class="source-select-container-legacy">
            <select id="source-select-legacy" class="source-select-legacy" onchange="switchSourceLegacy(this.value)">
            </select>
        </div>

        <!-- Buscador Legacy -->
        <div class="search-container-legacy">
            <input type="text" id="search-legacy" class="search-input-legacy" placeholder="Buscar canal o grupo..."
                onkeyup="filterChannelsLegacy()">
        </div>

        <!-- Controles de Paginación -->
        <div id="pagination-container-legacy" class="pagination-container-legacy">
            <div class="pagination-info-legacy">
                <span>Mostrar:</span>
                <select id="items-per-page-legacy" class="items-per-page-legacy"
                    onchange="changeItemsPerPageLegacy(this.value)">
                    <option value="10">10 por pág.</option>
                    <option value="20" selected>20 por pág.</option>
                    <option value="50">50 por pág.</option>
                    <option value="100">100 por pág.</option>
                </select>
                <span id="pagination-status-legacy">Cargando paginación...</span>
            </div>
            <div class="pagination-controls-legacy">
                <button id="btn-prev-legacy" class="pagination-btn-legacy" onclick="prevPageLegacy()" disabled>&laquo;
                    Anterior</button>
                <span id="page-indicator-legacy">Pág. 1/1</span>
                <button id="btn-next-legacy" class="pagination-btn-legacy" onclick="nextPageLegacy()" disabled>Siguiente
                    &raquo;</button>
            </div>
        </div>

        <div id="loading-indicator" class="loading-screen">
            Descargando lista de canales...
        </div>

        <div id="channels-container"></div>
    </div>

    <!-- Footer Bar -->
    <div class="footer-bar">
        SERVER IP: <span id="server-ip">-</span> | VERSION: <span class="app-version">-</span> (Legacy)
    </div>

    <script>
        // JS ES5 Estricto: SIN funciones flecha, SIN template literals, SIN let/const si se prefiere compatibilidad total
        // Se usa exclusivamente var y XMLHttpRequest clásica

        var allChannelsLegacy = [];
        var filteredChannelsLegacy = [];
        var currentSourceLegacy = '/aio';
        var currentPageLegacy = 1;
        var itemsPerPageLegacy = 20;
        var activeSourcesListLegacy = [];

        window.onload = function () {
            if (localStorage.getItem('theme') === 'light') {
                document.body.className = 'light-theme';
            }
            var hostIp = window.location.hostname || '127.0.0.1';
            document.getElementById('server-ip').innerHTML = hostIp;
            fetch('/stat/?action=get_status')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var sysHostname = (data.server_info && data.server_info.hostname) ? data.server_info.hostname : '';
                    if (sysHostname) {
                        document.getElementById('server-ip').innerHTML = hostIp + ' (' + sysHostname + ')';
                    }
                }).catch(function () { });
            updateLiveClockLegacy();
            setInterval(updateLiveClockLegacy, 1000);
            initSourcesLegacy();
        };

        function updateLiveClockLegacy() {
            var clockEl = document.getElementById('live-clock-legacy');
            if (clockEl) {
                var now = new Date();
                var h = ('0' + now.getHours()).slice(-2);
                var m = ('0' + now.getMinutes()).slice(-2);
                var s = ('0' + now.getSeconds()).slice(-2);
                clockEl.innerHTML = '🕒 ' + h + ':' + m + ':' + s;
            }
        }

        function initSourcesLegacy() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/config?action=get_config', true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    var sources = [];
                    if (xhr.status === 200) {
                        try {
                            var config = JSON.parse(xhr.responseText);
                            if (config && config.version) {
                                var elems = document.querySelectorAll('.app-version');
                                for (var k = 0; k < elems.length; k++) {
                                    elems[k].textContent = config.version;
                                }
                            }
                            var knownPlugins = [
                                { key: 'aio', label: 'AIO', url: '/aio' },
                                { key: 'newera', label: 'Newera', url: '/newera' },
                                { key: 'elcano', label: 'Elcano', url: '/elcano' },
                                { key: 'af1c1onados', label: 'Af1c1onados', url: '/af1c1onados' },
                                { key: 'acepl', label: 'Acepl', url: '/acepl' }
                            ];

                            var processedKeys = { aio: true, custom_lists: true, urls: true, version: true };
                            for (var kp = 0; kp < knownPlugins.length; kp++) {
                                processedKeys[knownPlugins[kp].key] = true;
                            }

                            for (var i = 0; i < knownPlugins.length; i++) {
                                var p = knownPlugins[i];
                                if (p.key === 'aio') {
                                    if (config.aio !== false) sources.push(p);
                                } else if (config[p.key] === true) {
                                    sources.push(p);
                                }
                            }

                            for (var key in config) {
                                if (config.hasOwnProperty(key) && !processedKeys[key] && config[key] === true) {
                                    sources.push({
                                        key: key,
                                        label: key.charAt(0).toUpperCase() + key.slice(1),
                                        url: '/' + key
                                    });
                                }
                            }

                            if (config.custom_lists && config.custom_lists.length) {
                                for (var j = 0; j < config.custom_lists.length; j++) {
                                    var item = config.custom_lists[j];
                                    if (item.enabled !== false && item.name) {
                                        sources.push({
                                            key: 'custom_' + item.name,
                                            label: item.name,
                                            url: '/' + item.name
                                        });
                                    }
                                }
                            }
                        } catch (e) { }
                    }

                    if (sources.length === 0) {
                        sources.push({ key: 'aio', label: 'AIO', url: '/aio' });
                    }

                    sources.unshift({ key: 'favoritos', label: '⭐ Favoritos', url: '/channels/favoritos.m3u' });

                    activeSourcesListLegacy = sources;
                    renderSourceSelectLegacy();
                    switchSourceLegacy(sources[0].url);
                }
            };
            xhr.send();
        }

        function renderSourceSelectLegacy() {
            var selectEl = document.getElementById('source-select-legacy');
            if (!selectEl) return;
            selectEl.innerHTML = '';

            for (var k = 0; k < activeSourcesListLegacy.length; k++) {
                var src = activeSourcesListLegacy[k];
                var opt = document.createElement('option');
                opt.value = src.url;
                opt.text = src.label;
                if (src.url === currentSourceLegacy) {
                    opt.selected = true;
                }
                selectEl.appendChild(opt);
            }
        }

        function switchSourceLegacy(url) {
            if (!url) return;
            currentSourceLegacy = url;
            currentPageLegacy = 1;

            var selectEl = document.getElementById('source-select-legacy');
            if (selectEl && selectEl.value !== url) {
                selectEl.value = url;
            }

            var searchEl = document.getElementById('search-legacy');
            if (searchEl) searchEl.value = '';

            document.getElementById('loading-indicator').style.display = 'block';
            document.getElementById('loading-status').innerHTML = 'Cargando canales de la fuente seleccionada...';
            loadLegacyData(url);
        }

        function stripQualityFromChannelName(name) {
            if (!name) return '';
            var n = name;
            // Quitar sufijos de procedencia (flechas)
            n = n.replace(/\s*(?:[-=]>|→|➔|➜|➡|⇒)\s*.*$/i, '');
            // Quitar sufijos de réplica tipo (2), (3)
            n = n.replace(/\s*[\(\[]\s*\d+\s*[\)\]]/g, '');
            // Quitar asteriscos tipo * o **
            n = n.replace(/\s*[*#]+\s*/g, ' ');
            // Quitar tokens de calidad
            n = n.replace(/\b(1080p|1080i|1080|720p|720i|720|576p|576i|480p|4k|uhd|fhda?|720a?|1080a|hd|sd|hevc|h265|h264)\b/gi, '');
            return n.replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
        }

        function groupChannelsLegacy(rawItems) {
            var groupedMap = {};
            var groupedList = [];

            for (var i = 0; i < rawItems.length; i++) {
                var item = rawItems[i];
                var rawName = item.name || '';
                var baseName = stripQualityFromChannelName(rawName);
                if (!baseName) baseName = rawName || 'Canal';

                // Detectar si el stream es 1080p o 720p
                var is720 = false;
                var is1080 = false;
                var nameAndUrl = (rawName + ' ' + item.url).toLowerCase();

                if (/\b(720p|720i|720|hd|720a)\b/i.test(nameAndUrl)) {
                    is720 = true;
                } else if (/\b(1080p|1080i|1080|fhd|fhda|1080a)\b/i.test(nameAndUrl)) {
                    is1080 = true;
                } else {
                    is1080 = true;
                }

                var key = (item.group || '') + '___' + baseName.toLowerCase();

                if (groupedMap[key]) {
                    var existing = groupedMap[key];
                    if (is720 && !existing.urls['720']) {
                        existing.urls['720'] = item.url;
                    } else if (is1080 && !existing.urls['1080']) {
                        existing.urls['1080'] = item.url;
                    }
                    if (!existing.logo && item.logo) {
                        existing.logo = item.logo;
                    }
                } else {
                    var chanObj = {
                        name: baseName,
                        fullName: rawName,
                        logo: item.logo || '',
                        group: item.group || 'Otros',
                        urls: {
                            '1080': is1080 ? item.url : '',
                            '720': is720 ? item.url : ''
                        },
                        selectedQuality: '1080'
                    };

                    // Si es una URL /auto/<slug>, derivar automáticamente 1080p y 720p
                    var autoIdx = item.url.indexOf('/auto/');
                    if (autoIdx !== -1) {
                        var rest = item.url.substring(autoIdx + 6);
                        var slashSub = rest.indexOf('/');
                        var rawSlug = (slashSub !== -1) ? rest.substring(0, slashSub) : rest;
                        var queryIdx = rawSlug.indexOf('?');
                        if (queryIdx !== -1) rawSlug = rawSlug.substring(0, queryIdx);
                        var extIdx = rawSlug.indexOf('.');
                        if (extIdx !== -1) rawSlug = rawSlug.substring(0, extIdx);

                        var cleanSlug = rawSlug.replace(/-(?:1080p|1080a|fhda?|720p|720a|hd|fhd)$/i, '');
                        var origin = item.url.substring(0, autoIdx + 6);
                        chanObj.urls['1080'] = origin + cleanSlug + '-1080p';
                        chanObj.urls['720'] = origin + cleanSlug + '-720p';
                    }

                    groupedMap[key] = chanObj;
                    groupedList.push(chanObj);
                }
            }

            // Fallback: Si un canal solo tiene una resolución disponible, rellenar la otra
            for (var j = 0; j < groupedList.length; j++) {
                var c = groupedList[j];
                if (!c.urls['1080'] && c.urls['720']) c.urls['1080'] = c.urls['720'];
                if (!c.urls['720'] && c.urls['1080']) c.urls['720'] = c.urls['1080'];
            }

            return groupedList;
        }

        function loadLegacyData(sourceUrl) {
            currentSourceLegacy = sourceUrl || '/channels/favoritos.m3u';
            var xhr = new XMLHttpRequest();
            var fetchUrl = currentSourceLegacy + (currentSourceLegacy.indexOf('?') !== -1 ? '&' : '?') + 't=' + (new Date().getTime());
            xhr.open('GET', fetchUrl, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        var m3uText = xhr.responseText;
                        var rawList = parseM3ULegacy(m3uText);
                        allChannelsLegacy = groupChannelsLegacy(rawList);
                        filteredChannelsLegacy = allChannelsLegacy;
                        currentPageLegacy = 1;
                        document.getElementById('loading-status').innerHTML = allChannelsLegacy.length + ' canales disponibles.';
                        renderCurrentPageLegacy();
                    } else {
                        document.getElementById('loading-status').innerHTML = 'Error al cargar canales (HTTP ' + xhr.status + ')';
                        document.getElementById('loading-indicator').style.display = 'none';
                    }
                }
            };
            xhr.send();
        }

        function parseM3ULegacy(text) {
            var lines = text.split('\n');
            var channels = [];
            var currentItem = null;

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (line.indexOf('#EXTINF:') === 0) {
                    currentItem = { logo: '', group: 'Otros', name: 'Canal', url: '' };

                    // Parse logo
                    var logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    if (logoMatch) {
                        currentItem.logo = logoMatch[1];
                    }

                    // Parse group
                    var groupMatch = line.match(/group-title="([^"]*)"/);
                    if (groupMatch) {
                        currentItem.group = groupMatch[1];
                    }

                    // Parse name
                    var commaIdx = line.lastIndexOf(',');
                    if (commaIdx !== -1) {
                        currentItem.name = line.substring(commaIdx + 1).trim();
                    }
                } else if (line.indexOf('#') !== 0 && line.length > 0 && currentItem) {
                    var streamUrl = line;
                    var baseHost = window.location.protocol + '//' + window.location.host;
                    var encName = encodeURIComponent(currentItem.name || 'stream');

                    if (line.indexOf('acestream://') === 0) {
                        var pid = line.substring(12).split('/')[0].trim();
                        streamUrl = baseHost + '/content_id/' + pid + '/' + encName + '.ts';
                    } else if (line.indexOf('infohash://') === 0) {
                        var hash = line.substring(11).split('/')[0].trim();
                        streamUrl = baseHost + '/infohash/' + hash + '/' + encName + '.ts';
                    } else if (line.indexOf('/') === 0) {
                        streamUrl = baseHost + line;
                    } else if (line.indexOf('http://') === 0 || line.indexOf('https://') === 0) {
                        streamUrl = line;
                    } else if (line.length >= 40 && /^[a-fA-F0-9]{40}$/.test(line)) {
                        streamUrl = baseHost + '/content_id/' + line + '/' + encName + '.ts';
                    }
                    currentItem.url = streamUrl;
                    channels.push(currentItem);
                    currentItem = null;
                }
            }
            return channels;
        }

        function filterChannelsLegacy() {
            var query = document.getElementById('search-legacy').value.toLowerCase().trim();
            var filtered = [];
            for (var i = 0; i < allChannelsLegacy.length; i++) {
                var chan = allChannelsLegacy[i];
                if (!query || chan.name.toLowerCase().indexOf(query) !== -1 || (chan.fullName && chan.fullName.toLowerCase().indexOf(query) !== -1) || chan.group.toLowerCase().indexOf(query) !== -1) {
                    filtered.push(chan);
                }
            }
            filteredChannelsLegacy = filtered;
            currentPageLegacy = 1;
            renderCurrentPageLegacy();
        }

        function changeItemsPerPageLegacy(val) {
            itemsPerPageLegacy = parseInt(val, 10) || 20;
            currentPageLegacy = 1;
            renderCurrentPageLegacy();
        }

        function prevPageLegacy() {
            if (currentPageLegacy > 1) {
                currentPageLegacy--;
                renderCurrentPageLegacy();
            }
        }

        function nextPageLegacy() {
            var totalPages = Math.ceil(filteredChannelsLegacy.length / itemsPerPageLegacy) || 1;
            if (currentPageLegacy < totalPages) {
                currentPageLegacy++;
                renderCurrentPageLegacy();
            }
        }

        function renderCurrentPageLegacy() {
            var totalItems = filteredChannelsLegacy.length;
            var totalPages = Math.ceil(totalItems / itemsPerPageLegacy) || 1;

            if (currentPageLegacy < 1) currentPageLegacy = 1;
            if (currentPageLegacy > totalPages) currentPageLegacy = totalPages;

            var startIndex = (currentPageLegacy - 1) * itemsPerPageLegacy;
            var endIndex = Math.min(startIndex + itemsPerPageLegacy, totalItems);

            var pageSlice = filteredChannelsLegacy.slice(startIndex, endIndex);

            var statusEl = document.getElementById('pagination-status-legacy');
            var indicatorEl = document.getElementById('page-indicator-legacy');
            var btnPrev = document.getElementById('btn-prev-legacy');
            var btnNext = document.getElementById('btn-next-legacy');

            if (statusEl) {
                if (totalItems === 0) {
                    statusEl.innerHTML = 'Sin canales disponibles';
                } else {
                    statusEl.innerHTML = 'Mostrando ' + (startIndex + 1) + '-' + endIndex + ' de ' + totalItems + ' canales';
                }
            }

            if (indicatorEl) {
                indicatorEl.innerHTML = 'Pág. ' + currentPageLegacy + '/' + totalPages;
            }

            if (btnPrev) btnPrev.disabled = (currentPageLegacy <= 1);
            if (btnNext) btnNext.disabled = (currentPageLegacy >= totalPages);

            renderChannelsLegacy(pageSlice, startIndex);
        }

        function getExactStreamUrlLegacy(originalUrl) {
            if (!originalUrl) return '';
            if (originalUrl.indexOf('acestream://') === 0) {
                var pid = originalUrl.substring(12).trim();
                return 'http://' + window.location.host + '/content_id/' + pid + '/stream.ts';
            }
            if (originalUrl.indexOf('infohash://') === 0) {
                var hash = originalUrl.substring(11).trim();
                return 'http://' + window.location.host + '/infohash/' + hash + '/stream.ts';
            }
            var streamUrl = originalUrl;
            try {
                var slashIdx = streamUrl.indexOf('//');
                if (slashIdx !== -1) {
                    var rest = streamUrl.substring(slashIdx + 2);
                    var nextSlash = rest.indexOf('/');
                    if (nextSlash !== -1) {
                        streamUrl = 'http://' + window.location.host + rest.substring(nextSlash);
                    }
                }
            } catch (e) { }
            return streamUrl;
        }

        function getVlcUrl(originalUrl) {
            var directUrl = getExactStreamUrlLegacy(originalUrl);
            if (directUrl.indexOf('http://') === 0) {
                return 'vlc://' + directUrl;
            } else if (directUrl.indexOf('https://') === 0) {
                return 'vlc://' + directUrl.substring(8);
            }
            return directUrl;
        }

        function copyUrlLegacy(url, btn) {
            var textarea = document.createElement('textarea');
            textarea.value = url;
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.width = '1px';
            textarea.style.height = '1px';
            textarea.style.padding = '0';
            textarea.style.border = 'none';
            textarea.style.outline = 'none';
            textarea.style.boxShadow = 'none';
            textarea.style.background = 'transparent';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                var successful = document.execCommand('copy');
                if (successful && btn) {
                    var originalSvg = btn.innerHTML;
                    btn.classList.add('copied');
                    btn.innerHTML = '✓';
                    setTimeout(function () {
                        btn.classList.remove('copied');
                        btn.innerHTML = originalSvg;
                    }, 2000);
                }
            } catch (err) {
                console.error('Legacy copy failed', err);
            }
            document.body.removeChild(textarea);
        }

        function escapeHtmlLegacy(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderChannelsLegacy(channels, startIndex) {
            var container = document.getElementById('channels-container');
            document.getElementById('loading-indicator').style.display = 'none';
            container.innerHTML = '';

            if (!channels || channels.length === 0) {
                if (currentSourceLegacy === '/channels/favoritos.m3u') {
                    container.innerHTML = '<div class="loading-screen" style="padding: 40px 20px;">' +
                        '<div style="font-size: 36px; margin-bottom: 8px;">⭐</div>' +
                        '<div style="font-size: 16px; font-weight: bold; margin-bottom: 8px;">No tienes canales en Favoritos</div>' +
                        '<div style="font-size: 13px; color: #888; margin-bottom: 16px;">No tienes canales en Favoritos. Añádelos desde la Guía EPG.</div>' +
                        '<a href="/epg/" style="display:inline-block; background:#00bcd4; color:#fff; padding:6px 14px; border-radius:4px; text-decoration:none; font-size:12px; font-weight:bold;">📅 Ir a Guía EPG</a>' +
                        '</div>';
                } else {
                    container.innerHTML = '<div class="loading-screen">No se encontraron canales.</div>';
                }
                return;
            }

            // Agrupar por categorías
            var grouped = {};
            var groups = [];
            for (var i = 0; i < channels.length; i++) {
                var chan = channels[i];
                chan._listIdx = (startIndex || 0) + i;
                if (!grouped[chan.group]) {
                    grouped[chan.group] = [];
                    groups.push(chan.group);
                }
                grouped[chan.group].push(chan);
            }

            groups.sort();

            for (var g = 0; g < groups.length; g++) {
                var groupName = groups[g];
                var groupChannels = grouped[groupName];

                var catHeader = document.createElement('div');
                catHeader.className = 'category-header';
                catHeader.innerHTML = escapeHtmlLegacy(groupName) + ' (' + groupChannels.length + ')';
                container.appendChild(catHeader);

                var list = document.createElement('ul');
                list.className = 'channel-list';

                for (var c = 0; c < groupChannels.length; c++) {
                    var channel = groupChannels[c];
                    var item = document.createElement('li');
                    item.className = 'channel-item';

                    var fallbackSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 100 100"><rect width="100" height="100" fill="%232d2d34"/><text x="50" y="55" font-family="sans-serif" font-size="24" fill="%23a8a8b2" text-anchor="middle" font-weight="bold">TV</text></svg>';
                    var fallbackLogo = "data:image/svg+xml;utf8," + encodeURIComponent(fallbackSvg);
                    var logoUrl = channel.logo || fallbackLogo;
                    var copyIcon = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';

                    var q = channel.selectedQuality || '1080';
                    var selectedUrl = channel.urls[q] || channel.urls['1080'] || channel.urls['720'] || '';
                    var vlcUrl = getVlcUrl(selectedUrl);
                    var listIdx = channel._listIdx;

                    var is1080Active = (q === '1080') ? ' active' : '';
                    var is720Active = (q === '720') ? ' active' : '';

                    item.innerHTML =
                        '<a id="btn-play-' + listIdx + '" href="' + vlcUrl + '" class="btn-play-legacy" target="_blank" title="Abrir en VLC">&#9654;</a>' +
                        '<button id="btn-copy-' + listIdx + '" class="btn-copy-legacy" onclick="copyChannelUrlLegacy(' + listIdx + ', this)" title="Copiar enlace del canal">' + copyIcon + '</button>' +
                        '<div class="channel-logo-container">' +
                        '<img class="channel-logo" src="' + logoUrl + '" onerror="this.src=\'' + fallbackLogo + '\'" />' +
                        '</div>' +
                        '<div class="channel-details">' +
                        '<div class="channel-name">' + escapeHtmlLegacy(channel.name) + '</div>' +
                        '<div class="quality-toggle-legacy">' +
                        '<button type="button" id="btn-q1080-' + listIdx + '" class="quality-btn-legacy quality-1080' + is1080Active + '" onclick="toggleChannelQualityLegacy(' + listIdx + ', \'1080\')">1080</button>' +
                        '<button type="button" id="btn-q720-' + listIdx + '" class="quality-btn-legacy quality-720' + is720Active + '" onclick="toggleChannelQualityLegacy(' + listIdx + ', \'720\')">720</button>' +
                        '</div>' +
                        '</div>';

                    list.appendChild(item);
                }
                container.appendChild(list);
            }
        }

        function toggleChannelQualityLegacy(listIdx, quality) {
            var chan = filteredChannelsLegacy[listIdx];
            if (!chan) return;
            chan.selectedQuality = quality;

            var btn1080 = document.getElementById('btn-q1080-' + listIdx);
            var btn720 = document.getElementById('btn-q720-' + listIdx);
            var btnPlay = document.getElementById('btn-play-' + listIdx);

            if (btn1080) {
                if (quality === '1080') btn1080.className = 'quality-btn-legacy quality-1080 active';
                else btn1080.className = 'quality-btn-legacy quality-1080';
            }
            if (btn720) {
                if (quality === '720') btn720.className = 'quality-btn-legacy quality-720 active';
                else btn720.className = 'quality-btn-legacy quality-720';
            }

            var selectedUrl = chan.urls[quality] || chan.urls['1080'] || chan.urls['720'] || '';
            if (btnPlay) {
                btnPlay.href = getVlcUrl(selectedUrl);
            }
        }

        function copyChannelUrlLegacy(listIdx, btn) {
            var chan = filteredChannelsLegacy[listIdx];
            if (!chan) return;
            var quality = chan.selectedQuality || '1080';
            var selectedUrl = chan.urls[quality] || chan.urls['1080'] || chan.urls['720'] || '';
            copyUrlLegacy(getExactStreamUrlLegacy(selectedUrl), btn);
        }
    </script>
</body>
