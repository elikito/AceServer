services:
  # MOTOR MODERN: Para hardware moderno (N150, Asus) con soporte AVX/SSE4.2
  aceserve-modern:
    image: jopsis/aceserve:latest
    container_name: aceserve-modern
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    ports:
      - "6878:6878/tcp"
      - "6878:6878/udp"
      - "62062:62062/tcp"
      - "8621:8621/tcp"
      - "8621:8621/udp"
      - "8622-8630:8622-8630/udp"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - aceproxy-net

  # MOTOR COMPAT LIGHT: Para hardware antiguo (Core 2 Duo sin AVX)
  aceserve-compat-light:
    image: wafy80/acestream:latest
    container_name: aceserve-compat-light
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - aceproxy-net

  # MOTOR COMPAT STABLE: Para hardware antiguo (Core 2 Duo sin AVX)
  aceserve-compat-stable:
    image: blaiseio/acelink:latest
    container_name: aceserve-compat-stable
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - aceproxy-net

  httpaceproxy:
    build:
      context: .
      dockerfile: httpaceproxycpp/Dockerfile
    container_name: httpaceproxy
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - TZ=Europe/Madrid
      # --- SELECTOR DE MOTOR EN CALIENTE ---
      - ACESTREAM_HOST=aceserve-modern
      - ACESTREAM_API_PORT=62062
      - ACESTREAM_HTTP_PORT=6878
      - ENABLED_PLUGINS=newera,elcano,acepl,af1c1onados,aio,stat,statplugin
    volumes:
      - /opt/HTTPAceProxy/httpaceproxycpp/http:/app/http
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - aceproxy-net

networks:
  aceproxy-net:
    driver: bridge