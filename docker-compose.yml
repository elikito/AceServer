services:
  # MOTOR MODERN: Para hardware moderno (N150, N100) con soporte AVX / SSE4.2
  aceserve-modern:
    image: jopsis/aceserve:latest
    container_name: aceserve-modern
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TZ=Europe/Madrid
    ports:
      - "6878:6878/tcp"
      - "6878:6878/udp"
      - "62062:62062/tcp"
      - "8621:8621/tcp"
      - "8621:8621/udp"
      - "8622-8630:8622-8630/udp"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - aceproxy-net

  # MOTOR COMPAT LIGHT: Para hardware antiguo (Core 2 Duo sin AVX - Imagen Wafy80)
  aceserve-compat-light:
    image: wafy80/acestream:latest
    container_name: aceserve-compat-light
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TZ=Europe/Madrid
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - aceproxy-net

  # MOTOR COMPAT STABLE: Para hardware antiguo (Core 2 Duo sin AVX - Imagen Blaiseio)
  aceserve-compat-stable:
    image: blaiseio/acelink:latest
    container_name: aceserve-compat-stable
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TZ=Europe/Madrid
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - aceproxy-net

  # PROXY PRINCIPAL EN C++ (httpaceproxycpp)
  httpaceproxy:
    build:
      context: .
      dockerfile: httpaceproxycpp/Dockerfile
    container_name: httpaceproxy
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8888:8888"
    environment:
      - TZ=Europe/Madrid
      # --- SELECTOR DE MOTOR EN CALIENTE ---
      - ACESTREAM_HOST=aceserve-modern
      - ACESTREAM_API_PORT=62062
      - ACESTREAM_HTTP_PORT=6878
      - ENABLED_PLUGINS=newera,elcano,acepl,af1c1onados,aio,stat,statplugin
    volumes:
      # Mapeo del frontend web e interfaz Bento
      - /opt/HTTPAceProxy/httpaceproxycpp/http:/app/http
      # Socket de Docker para gestión de motores en vivo
      - /var/run/docker.sock:/var/run/docker.sock
      # Mapeos de hora local del sistema
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Socket IPC y binario de Cloudflare WARP del host
      - /run/cloudflare-warp:/run/cloudflare-warp
      - /usr/bin/warp-cli:/usr/bin/warp-cli:ro
    depends_on:
      - aceserve-modern
    networks:
      - aceproxy-net

networks:
  aceproxy-net:
    driver: bridge