
networks:
  aceproxy-net:
    driver: bridge

services:
  httpaceproxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: httpaceproxy
    restart: unless-stopped
    ports:
      - "8888:8888"
    networks:
      - aceproxy-net
    depends_on:
      - aceserve-modern
      - ipfs-node
    volumes:
      - ./config:/opt/HTTPAceProxy/config
      - /run/cloudflare-warp:/run/cloudflare-warp
      - /usr/bin/warp-cli:/usr/bin/warp-cli:ro

  aceserve-modern:
    image: jopsis/aceserve:latest
    container_name: aceserve-modern
    restart: unless-stopped
    networks:
      - aceproxy-net
    ports:
      - "6878:6878/tcp"
      - "6878:6878/udp"
      - "8621:8621/tcp"
      - "8621:8621/udp"
      - "62062:62062/tcp"
      - "8622-8630:8622-8630/udp"
    environment:
      - ACESTREAM_OPTS=--live-buffer 35 --vod-buffer 20 --max-connections 500 --live-cache-type memory --live-mem-cache-size 524288000
    command:
      - python
      - main.py
      - --live-cache-type
      - memory
      - --live-mem-cache-size
      - "524288000"
      - --live-buffer
      - "35"
      - --vod-buffer
      - "20"
      - --max-connections
      - "500"
      - --max-peers
      - "100"

  ipfs-node:
    image: ipfs/go-ipfs:latest
    container_name: ipfs-node
    restart: unless-stopped
    networks:
      - aceproxy-net
    ports:
      - "4001:4001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs

volumes:
  ipfs_data:
